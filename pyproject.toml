[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inv-pdf"
version = "0.1.0"
description = "Invert PDF colors page-by-page with parallel processing — dark-mode PDFs from any source"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Santt997", email = "santiago.burastero@gmail.com" },
]
keywords = ["pdf", "invert", "colors", "dark mode", "pymupdf", "pillow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
    "Environment :: Console",
]
requires-python = ">=3.8"
dependencies = [
    "pymupdf>=1.23.0",
    "Pillow>=9.0.0",
]

[project.scripts]
inv-pdf = "inv_pdf.cli:main"

[project.urls]
Homepage = "https://github.com/Santt997/inv-colors"
Repository = "https://github.com/Santt997/inv-colors"
"Bug Tracker" = "https://github.com/Santt997/inv-colors/issues"
Changelog = "https://github.com/Santt997/inv-colors/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/inv_pdf"]
